<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTX Bình Mỹ — Trang truy cập</title>
  <meta name="description" content="Trang tổng hợp 4 cổng: Trang chủ, Nông dân, HTX, Doanh nghiệp." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Be Vietnam Pro',sans-serif;
      background:#f1f5f9;
      color:#0f172a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      line-height:1.5;
    }
    .card{
      max-width:480px;width:100%;
      background:#fff;
      border-radius:20px;
      padding:28px 24px;
      box-shadow:0 4px 20px rgba(15,23,42,.08);
    }
    h1{font-size:20px;font-weight:700;margin-bottom:4px}
    p.lead{font-size:14px;color:#64748b;margin-bottom:20px}
    a.tile{
      display:flex;align-items:center;gap:14px;
      padding:16px 18px;
      border-radius:14px;
      background:#f8fafc;
      text-decoration:none;color:inherit;
      border:1px solid #e2e8f0;
      margin-bottom:10px;
      transition:background .2s;
    }
    a.tile:hover{background:#f1f5f9}
    a.tile .ico{
      width:40px;height:40px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;
      background:#16a34a;color:#fff;
      flex-shrink:0;
    }
    a.tile .txt{flex:1;font-weight:600;font-size:15px}
    a.tile .arr{color:#94a3b8;font-size:18px}
    .footer{font-size:12px;color:#94a3b8;text-align:center;margin-top:18px}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>HTX Nông nghiệp Bình Mỹ</h1>
    <p class="lead">Chọn trang bạn muốn vào:</p>

    <nav aria-label="Các trang">
      <a class="tile" href="./">
        <div class="ico" aria-hidden="true">🏠</div>
        <div class="txt">Trang chủ</div>
        <span class="arr" aria-hidden="true">→</span>
      </a>

      <a class="tile" href="./nong-dan/">
        <div class="ico" aria-hidden="true">👨‍🌾</div>
        <div class="txt">Cổng Nông dân</div>
        <span class="arr" aria-hidden="true">→</span>
      </a>

      <a class="tile" href="./htx/">
        <div class="ico" aria-hidden="true">🤝</div>
        <div class="txt">Cổng HTX</div>
        <span class="arr" aria-hidden="true">→</span>
      </a>

      <a class="tile" href="./doanh-nghiep/">
        <div class="ico" aria-hidden="true">🏢</div>
        <div class="txt">Cổng Doanh nghiệp</div>
        <span class="arr" aria-hidden="true">→</span>
      </a>
    </nav>

    <p class="footer">HTX Nông nghiệp Bình Mỹ</p>
  </main>
</body>
</html>
